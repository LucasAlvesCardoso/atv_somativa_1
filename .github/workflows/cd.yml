name: CD

# Em pull request a imagem e apenas construida (validacao).
# Em push para main ela e construida e publicada nos registries.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    name: Construir e publicar a imagem
    runs-on: ubuntu-latest

    env:
      # Lido em `if:` mais abaixo. Sem o secret configurado o passo do Docker Hub
      # e pulado em vez de falhar, entao o workflow segue verde so com o GHCR.
      DOCKERHUB_USUARIO: ${{ secrets.DOCKERHUB_USERNAME }}
      NOME_IMAGEM: encurtador-api

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Preparar o Buildx
        uses: docker/setup-buildx-action@v3

      - name: Definir os registries de destino
        id: destinos
        run: |
          set -euo pipefail

          # O GHCR so aceita nomes em minusculas.
          lista="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          if [ -n "${DOCKERHUB_USUARIO}" ]; then
            lista="${lista}"$'\n'"docker.io/${DOCKERHUB_USUARIO}/${NOME_IMAGEM}"
            echo "Docker Hub configurado: a imagem tambem sera publicada la."
          else
            echo "Secret DOCKERHUB_USERNAME ausente: publicando somente no GHCR."
          fi

          {
            echo 'imagens<<FIM'
            echo "${lista}"
            echo 'FIM'
          } >> "$GITHUB_OUTPUT"

      - name: Montar as tags e os metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.destinos.outputs.imagens }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=short

      - name: Autenticar no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Autenticar no Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USUARIO != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          # Em PR nao ha o que publicar: construir ja prova que o Dockerfile esta de pe.
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumir a publicacao
        run: |
          {
            echo '### Imagem'
            echo
            if [ "${{ github.event_name }}" = 'pull_request' ]; then
              echo 'Pull request: a imagem foi construida para validacao, sem publicacao.'
            else
              echo 'Publicada com as tags:'
              echo
              echo '```'
              echo "${{ steps.meta.outputs.tags }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  alerta:
    name: Alerta no Discord
    needs: [publicar]
    if: always()
    uses: ./.github/workflows/alerta-discord.yml
    with:
      fluxo: CD
      resultado: ${{ needs.publicar.result }}
    secrets:
      webhook: ${{ secrets.DISCORD_WEBHOOK }}
